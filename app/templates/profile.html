{% extends "base.html" %}

{% block title %}My account | Craftarr{% endblock %}

{% block content %}
<div class="account-page" data-page-title="My account">
    <section class="page-header">
        <div>
            <h1>My account</h1>
            <p>Change your name or password.</p>
        </div>
    </section>

    <section class="overview-card settings-section">
        <div class="card-header"><i class="fa-solid fa-user" aria-hidden="true"></i> Account details</div>
        <form class="settings-content account-form" method="post" action="/profile">
            <label class="property-field">
                <span>Username</span>
                <input name="username" value="{{ user.username }}" required>
            </label>
            <label class="property-field">
                <span>New password</span>
                <input name="password" type="password" minlength="8" placeholder="Leave blank to keep your current password">
            </label>
            <div class="settings-save-row">
                <button class="button success" type="submit"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Save changes</button>
            </div>
        </form>
    </section>
</div>
{% endblock %}
