<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Two-Factor Authentication | Craftarr
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css?v=20260929-2"
    >
    <link rel="stylesheet" href="/static/server-manager.css?v=20260927-5">
</head>

<body class="login-body">

    <div class="login-shell">

        <div class="login-logo-wrap">

            <img
                src="/static/images/logo.png"
                class="login-logo"
                alt="Craftarr"
            >

        </div>


        <div class="login-card">

            <h1>
                Authentication code
            </h1>

            <p>
                Enter the 6-digit code from your authenticator app,
                or one of your recovery codes.
            </p>


            {% if error %}

            <div class="login-error">
                {{ error }}
            </div>

            {% endif %}


            <form
                method="post"
                action="/login/tfa"
            >

                <label class="login-field">

                    <span>
                        Authentication code
                    </span>

                    <input
                        class="tfa-login-code"
                        type="text"
                        name="code"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        autofocus
                        required
                    >

                </label>


                <button
                    class="login-button"
                    type="submit"
                >
                    Continue
                </button>

            </form>

        </div>


        <div class="login-version">
            Craftarr v{{ app_version }}
        </div>

    </div>

    <script src="/static/form_feedback.js?v=20260809-1"></script>
</body>

</html>
