<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login | Craftarr</title>

    <link rel="stylesheet" href="/static/style.css?v=20260929-1">
    <link rel="stylesheet" href="/static/server-manager.css?v=20260927-5">
</head>

<body class="login-body">

    <div class="login-shell">

        <div class="login-logo-wrap">

            <img src="/static/images/logo.png" alt="Craftarr" class="login-logo">

        </div>


        <div class="login-card">

            <h1>Welcome back</h1>

            <p>
                {{ login_message }}
            </p>

            {% if request.query_params.get('expired') %}
            <div class="login-notice" role="status">Your session expired. Sign in again to continue.</div>
            {% endif %}


            {% if error %}

            <div class="login-error">
                {{ error }}
            </div>

            {% endif %}


            <form method="post" action="/login">

                <label class="login-field">

                    <span>Username</span>

                    <input type="text" name="username" autocomplete="username" autofocus required>

                </label>


                <label class="login-field">

                    <span>Password</span>

                    <input type="password" name="password" autocomplete="current-password" required>

                </label>


                <button type="submit" class="login-button">
                    Sign In
                </button>

            </form>

            <div class="login-help">

                <a href="/forgot-password">
                    Forgot password?
                </a>

            </div>

        </div>

    </div>

    <div class="login-version">
        v{{ app_version }} · <a href="https://github.com/STEMMechanics/Craftarr" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
    <script src="/static/form_feedback.js?v=20260809-1"></script>
</body>

</html>
