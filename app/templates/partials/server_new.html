<div
    class="server-create-page"
    data-page-title="Create a server"
>

    <section class="servers-page-intro">
        <div>
            <h1>Make a Minecraft server</h1>
            <p>Pick a name and game settings. You can change them later.</p>
        </div>
        <a href="/servers/import" class="button success"
           hx-get="/servers/import" hx-target="#page-content" hx-push-url="true">
            <i class="fa-solid fa-file-import" aria-hidden="true"></i> Import a server
        </a>
    </section>

    <form
        class="server-create-form"
        method="post"
        action="/servers/new"
    >

        <section class="overview-card settings-section">
            <div class="card-header">Start your server</div>
            <div class="settings-content server-create-grid">
                <label class="property-field full-width">
                    <span>Server name</span>
                    <input name="name" type="text" placeholder="My Minecraft Server" required autofocus>
                </label>
                <label class="property-field">
                    <span>Minecraft version</span>
                    <select id="create-minecraft-version" name="minecraft_version" required onchange="selectRecommendedJava()">
                        {% for version in versions %}
                        <option value="{{ version }}">{{ version }}</option>
                        {% else %}
                        <option value="" disabled>No versions available</option>
                        {% endfor %}
                    </select>
                    <small>We install the server software for this game version.</small>
                </label>
            </div>

            <details class="server-create-extra-options">
                <summary>
                    <span class="server-create-summary-copy">
                        Other server settings <span class="server-create-summary-note">(you can skip these)</span>
                    </span>
                </summary>
                <div class="settings-content server-create-grid">
                    <label class="property-field">
                        <span>Connection port</span>
                        <input id="create-server-port" name="port" type="number" value="25565" min="1" max="65535" required oninput="checkServerPortWarning(this.value)">
                        <small id="server-port-warning" class="port-conflict-warning" hidden></small>
                        <small>Players use this number to join. Leave 25565 as it is.</small>
                    </label>
                    <label class="property-field">
                        <span>Memory</span>
                        <select name="memory">
                            <option value="1G">1 GB</option><option value="2G">2 GB</option>
                            <option value="4G" selected>4 GB</option><option value="6G">6 GB</option>
                            <option value="8G">8 GB</option><option value="12G">12 GB</option>
                            <option value="16G">16 GB</option>
                        </select>
                        <small>More players and plugins may need more memory.</small>
                    </label>
                    <label class="property-field">
                        <span>How should we run it?</span>
                        <select name="process_backend">
                            <option value="systemd" {% if systemd_available %}selected{% else %}disabled{% endif %}>Recommended (keeps running)</option>
                            <option value="subprocess" {% if not systemd_available %}selected{% endif %}>Run inside this app</option>
                        </select>
                        {% if systemd_available %}
                        <small>Minecraft can keep running if this app restarts.</small>
                        {% else %}
                        <small>This computer uses the app to run Minecraft.</small>
                        {% endif %}
                    </label>
                    <label class="property-field">
                        <span>Java for Minecraft</span>
                        <select id="create-java-path" name="java_major" required>
                            {% for runtime in java_runtimes %}
                            <option value="{{ runtime.major }}" data-java-major="{{ runtime.major }}">{{ runtime.label }}</option>
                            {% else %}
                            <option value="" disabled>No Java versions found</option>
                            {% endfor %}
                        </select>
                        <small>Minecraft needs Java. We choose a version for you.</small>
                    </label>
                </div>
            </details>
        </section>

        <details class="server-create-advanced">
            <summary>
                <span class="server-create-summary-copy">
                    Change game and world settings <span class="server-create-summary-note">(optional)</span>
                </span>
            </summary>

        <section class="overview-card settings-section">

            <div class="card-header">
                Gameplay
            </div>

            <div class="settings-content server-create-grid">

                <label class="property-field">

                    <span>Player limit</span>

                    <input
                        name="max_players"
                        type="number"
                        value="20"
                        min="1"
                        max="1000"
                    >

                </label>


                <label class="property-field">

                    <span>Difficulty</span>

                    <select name="difficulty">

                        <option value="peaceful">
                            Peaceful
                        </option>

                        <option value="easy">
                            Easy
                        </option>

                        <option
                            value="normal"
                            selected
                        >
                            Normal
                        </option>

                        <option value="hard">
                            Hard
                        </option>

                    </select>

                </label>


                <label class="property-field">

                    <span>Game mode</span>

                    <select name="gamemode">

                        <option
                            value="survival"
                            selected
                        >
                            Survival
                        </option>

                        <option value="creative">
                            Creative
                        </option>

                        <option value="adventure">
                            Adventure
                        </option>

                        <option value="spectator">
                            Spectator
                        </option>

                    </select>

                </label>


                <label class="property-field">

                    <span>View distance</span>

                    <input
                        name="view_distance"
                        type="number"
                        value="10"
                        min="2"
                        max="32"
                    >

                    <small>
                        How far away players can see (2–32 chunks).
                    </small>

                </label>


                <label class="property-field">

                    <span>Game update distance</span>

                    <input
                        name="simulation_distance"
                        type="number"
                        value="10"
                        min="2"
                        max="32"
                    >

                    <small>
                        How far away the game updates blocks and mobs (2–32 chunks).
                    </small>

                </label>

            </div>

        </section>


        <section class="overview-card settings-section">

            <div class="card-header">
                World
            </div>

            <div class="settings-content server-create-grid">

                <label class="property-field full-width">

                    <span>World name</span>

                    <input
                        name="world_name"
                        type="text"
                        value="world"
                        required
                    >

                    <small>
                        This is the name of the main world folder.
                    </small>

                </label>


                <label class="property-field">

                    <span>World type</span>

                    <select name="world_type">

                        <option
                            value="minecraft:normal"
                            selected
                        >
                            Normal
                        </option>

                        <option value="minecraft:flat">
                            Flat
                        </option>

                        <option value="minecraft:large_biomes">
                            Large Biomes
                        </option>

                        <option value="minecraft:amplified">
                            Amplified
                        </option>

                    </select>

                </label>


                <label class="property-field">

                    <span>World seed</span>

                    <input
                        name="seed"
                        type="text"
                        placeholder="Leave empty for random"
                    >

                </label>


                <label class="property-toggle">

                    <div>

                        <strong>
                            Generate Structures
                        </strong>

                        <small>
                            Villages, strongholds and other generated structures.
                        </small>

                    </div>

                    <span class="switch">

                        <input
                            name="generate_structures"
                            type="checkbox"
                            checked
                        >

                        <span class="switch-slider"></span>

                    </span>

                </label>


                <label class="property-toggle">

                    <div>
                        <strong>Spawn Animals</strong>
                    </div>

                    <span class="switch">

                        <input
                            name="spawn_animals"
                            type="checkbox"
                            checked
                        >

                        <span class="switch-slider"></span>

                    </span>

                </label>


                <label class="property-toggle">

                    <div>
                        <strong>Spawn Monsters</strong>
                    </div>

                    <span class="switch">

                        <input
                            name="spawn_monsters"
                            type="checkbox"
                            checked
                        >

                        <span class="switch-slider"></span>

                    </span>

                </label>


                <label class="property-toggle">

                    <div>
                        <strong>Spawn NPCs</strong>
                    </div>

                    <span class="switch">

                        <input
                            name="spawn_npcs"
                            type="checkbox"
                            checked
                        >

                        <span class="switch-slider"></span>

                    </span>

                </label>

            </div>

        </section>


        <section class="overview-card settings-section">

            <div class="card-header">
                Server
            </div>

            <div class="settings-content server-create-grid">

                <label class="property-toggle">

                    <div>

                        <strong>
                            Online Mode
                        </strong>

                        <small>
                            Authenticate players with Mojang/Microsoft.
                        </small>

                    </div>

                    <span class="switch">

                        <input
                            name="online_mode"
                            type="checkbox"
                            checked
                        >

                        <span class="switch-slider"></span>

                    </span>

                </label>


                <label class="property-toggle">

                    <div>

                        <strong>
                            Only allow listed players to join
                        </strong>

                    </div>

                    <span class="switch">

                        <input
                            name="whitelist"
                            type="checkbox"
                        >

                        <span class="switch-slider"></span>

                    </span>

                </label>


                <label class="property-toggle">

                    <div>
                        <strong>Enable PvP</strong>
                    </div>

                    <span class="switch">

                        <input
                            name="pvp"
                            type="checkbox"
                            checked
                        >

                        <span class="switch-slider"></span>

                    </span>

                </label>


                <label class="property-toggle">

                    <div>
                        <strong>Enable Command Blocks</strong>
                    </div>

                    <span class="switch">

                        <input
                            name="enable_command_blocks"
                            type="checkbox"
                        >

                        <span class="switch-slider"></span>

                    </span>

                </label>


                <label class="property-field full-width">

                    <span>
                        Server list message
                    </span>

                    <input
                        name="motd"
                        type="text"
                        value="A Minecraft Server"
                        maxlength="59"
                    >

                    <small>
                        Message displayed in the Minecraft server list.
                    </small>

                </label>

            </div>

        </section>


        </details>

        <section class="overview-card settings-section">

            <div class="card-header">
                Minecraft server rules
            </div>

            <div class="settings-content">

                <label class="property-toggle eula-toggle">

                    <div>

                        <strong>
                            I agree to Minecraft's rules (EULA)
                        </strong>

                        <small>
                            Minecraft needs this agreement before it can make your server.
                        </small>

                    </div>

                    <span class="switch">

                        <input
                            id="server-eula"
                            name="accept_eula"
                            type="checkbox"
                            required
                            onchange="updateCreateServerButton()"
                        >

                        <span class="switch-slider"></span>

                    </span>

                </label>

            </div>

        </section>


        <div class="server-create-actions">

            <a
                href="/servers"
                class="button secondary"
            >
                Cancel
            </a>

            <button
                id="create-server-button"
                class="button"
                type="submit"
                disabled
            >
                <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i> Make server
            </button>

        </div>

    </form>

</div>


<script>

function updateCreateServerButton() {

    const eula =
        document.getElementById(
            "server-eula"
        );

    const button =
        document.getElementById(
            "create-server-button"
        );

    if (!eula || !button) {
        return;
    }

    button.disabled =
        !eula.checked;
}

function selectRecommendedJava() {
    const version = document.getElementById("create-minecraft-version")?.value || "";
    const select = document.getElementById("create-java-path");
    if (!select) return;
    const numbers = (version.match(/\d+/g) || []).map(Number);
    const major = (numbers[0] || 0) >= 26 ? 25
        : (numbers[0] === 1 && (numbers[1] || 0) >= 20) ? 21
        : (numbers[0] === 1 && (numbers[1] || 0) >= 17) ? 17
        : (numbers[0] === 1 && (numbers[1] || 0) >= 12) ? 11 : 8;
    const recommended = Array.from(select.options).find(
        option => Number(option.dataset.javaMajor) === major
    );
    if (recommended) select.value = recommended.value;
}

updateCreateServerButton();
selectRecommendedJava();
(function initializeCreateServerPortWarning() {
    const run = () => {
        if (typeof window.checkServerPortWarning === "function") {
            window.checkServerPortWarning(document.getElementById("create-server-port")?.value);
        }
    };
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", run, { once: true });
    } else {
        run();
    }
})();

</script>
