<div class="console-page" data-server-id="{{ server.id }}" data-page-title="Console">

  <div class="console-toolbar">

    <div class="console-filters" role="group" aria-label="Filter console by log level">
      <button class="console-filter active" type="button" data-level="ALL" aria-pressed="true" aria-label="All messages" title="All messages">
        <i class="fa-solid fa-list" aria-hidden="true"></i><span>All</span>
      </button>

      <button class="console-filter" type="button" data-level="INFO" aria-pressed="false" aria-label="Info messages" title="Info messages">
        <i class="fa-solid fa-circle-info" aria-hidden="true"></i><span>Info</span>
      </button>

      <button class="console-filter" type="button" data-level="WARN" aria-pressed="false" aria-label="Warnings" title="Warnings">
        <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i><span>Warnings</span>
      </button>

      <button class="console-filter" type="button" data-level="ERROR" aria-pressed="false" aria-label="Errors" title="Errors">
        <i class="fa-solid fa-circle-xmark" aria-hidden="true"></i><span>Errors</span>
      </button>

      <button class="console-filter" type="button" data-level="DEBUG" aria-pressed="false" aria-label="Debug messages" title="Debug messages">
        <i class="fa-solid fa-bug" aria-hidden="true"></i><span>Debug</span>
      </button>
    </div>


    <div class="console-toolbar-actions">

<button id="console-autoscroll" class="console-icon-button active" onclick="toggleConsoleAutoScroll()"
  title="Auto-scroll enabled">
  <i class="fa-solid fa-arrow-down"></i>
</button>

      <button class="button" onclick="updateConsolePage()">
        <i class="fa-solid fa-rotate" aria-hidden="true"></i> Refresh
      </button>

    </div>

  </div>


  <div id="console-output" class="console-output"></div>


  <div class="console-command">

    <span class="console-prompt">
      ›
    </span>

    <input id="console-input" type="text" placeholder="Type a command and press Enter..." autocomplete="off">

    <button class="button success" id="console-send" onclick="sendConsoleCommand()">
      <i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Send
    </button>

  </div>

</div>
