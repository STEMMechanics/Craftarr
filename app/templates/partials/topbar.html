{% set topbar_server = active_server if active_server else none %}
<div class="topbar" data-server-id="{{ topbar_server.id if topbar_server else '' }}">
  <div class="topbar-actions">
    <div class="notification-center" data-user-id="{{ user.id or user.username }}">
      <button id="notifications-toggle" class="icon-button topbar-icon-button" type="button"
              onclick="toggleNotifications()" aria-label="Notifications" aria-expanded="false"
              aria-controls="notifications-panel" title="Notifications">
        <i class="fa-regular fa-bell" aria-hidden="true"></i>
        <span id="notifications-count" class="notification-count" hidden></span>
      </button>
      <div id="notifications-panel" class="notification-popover" role="region" hidden aria-labelledby="notifications-heading">
        <div class="notification-popover-heading">
          <strong id="notifications-heading">Notifications</strong>
          <div class="notification-heading-actions">
            <button id="notifications-mark-read" class="notification-mark-read" type="button" onclick="markAllNotificationsRead()" hidden>Mark all read</button>
            <button class="icon-button" type="button" onclick="closeNotifications()" aria-label="Close notifications">
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <div id="notification-list" class="notification-list" role="list" hidden></div>
        <div id="notification-empty" class="notification-empty">
          <span class="notification-empty-icon" aria-hidden="true"><i class="fa-regular fa-bell-slash"></i></span>
          <strong>All caught up</strong>
          <p>Update notices will appear here.</p>
        </div>
      </div>
    </div>

    {% if user.can('servers.control') %}
    <div class="topbar-server-controls" role="group" aria-label="Selected server controls" {% if not topbar_server %}hidden{% endif %}>
      <button id="topbar-server-start" class="topbar-server-control start" type="button" onclick="serverAction('start')" aria-label="Start selected server" title="Start server" disabled><i class="fa-solid fa-play" aria-hidden="true"></i></button>
      <button id="topbar-server-stop" class="topbar-server-control stop" type="button" onclick="serverAction('stop')" aria-label="Stop selected server" title="Stop server" disabled><i class="fa-solid fa-stop" aria-hidden="true"></i></button>
      <button id="topbar-server-restart" class="topbar-server-control restart" type="button" onclick="serverAction('restart')" aria-label="Restart selected server" title="Restart server" disabled><i class="fa-solid fa-rotate-right" aria-hidden="true"></i></button>
    </div>
    {% endif %}

    <div class="account-menu">
      <button id="account-menu-toggle" class="account-menu-toggle" type="button"
              onclick="toggleAccountMenu()" aria-label="User menu for {{ user.username }}"
              aria-expanded="false" aria-controls="account-menu-panel">
        <span class="account-avatar" aria-hidden="true">{{ (user.username or 'M')[:1]|upper }}</span>
        <span class="account-menu-username">{{ user.username }}</span>
        <i class="fa-solid fa-chevron-down account-menu-chevron" aria-hidden="true"></i>
      </button>
      <div id="account-menu-panel" class="account-menu-panel" role="group" aria-label="User settings and account actions" hidden>
        <div class="account-menu-heading">
          <strong>{{ user.username }}</strong>
          <small>{{ user.role_name }}</small>
        </div>
        <a href="/profile"><i class="fa-solid fa-user-gear" aria-hidden="true"></i><span>My account</span></a>
        <a href="/change-password"><i class="fa-solid fa-key" aria-hidden="true"></i><span>Change password</span></a>
        <div class="account-menu-divider"></div>
        <a class="account-menu-signout" href="/logout"><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i><span>Sign out</span></a>
      </div>
    </div>
  </div>
</div>
