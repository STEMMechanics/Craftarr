<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password | Craftarr</title>
    <link rel="stylesheet" href="/static/style.css?v=20260929-3">
    <link rel="stylesheet" href="/static/server-manager.css?v=20260927-5">
</head>

<body class="login-body">
    <div class="login-shell">
        <div class="login-logo-wrap">
        <img src="/static/images/logo.png" alt="Craftarr" class="login-logo">
        </div>

        <div class="login-card">
            <h1>Choose a new password</h1>
            <p>Your temporary password must be changed before you can continue.</p>

            {% if error %}
            <div class="login-error">{{ error }}</div>
            {% endif %}

            <form id="change-password-form" method="post" action="/change-password">
                <label class="login-field">
                    <span>New password</span>
                    <input type="password" name="password" autocomplete="new-password" minlength="8" autofocus required>
                </label>

                <label class="login-field">
                    <span>Confirm new password</span>
                    <input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required>
                </label>

                <button type="submit" class="login-button">Change Password</button>
            </form>

            <div class="login-help"><a href="/logout">Sign out</a></div>
        </div>
    </div>

    <div class="login-version">v{{ app_version }}</div>
    <script src="/static/form_feedback.js?v=20260809-1"></script>
</body>

</html>
