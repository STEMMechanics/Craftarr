name: Docker Image

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "alembic.ini"
      - "requirements.txt"
      - "app/**"
      - "migrations/**"
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"

  workflow_dispatch:
    inputs:
      version:
        description: Optional release version to publish (for example 0.4.0)
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build Craftarr image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare optional release version
        id: manual_version
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
        env:
          VERSION: ${{ github.event.inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must have three numeric parts, for example 0.4.0." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major_minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/stemmechanics/craftarr
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.manual_version.outputs.version }},enable=${{ steps.manual_version.outputs.version != '' }}
            type=raw,value=${{ steps.manual_version.outputs.major_minor }},enable=${{ steps.manual_version.outputs.major_minor != '' }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
