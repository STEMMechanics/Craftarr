name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Validate tag and application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          app_version=$(python -c 'from app.version import APP_VERSION; print(APP_VERSION)')
          if [[ "$version" != "$app_version" ]]; then
            echo "Tag $tag does not match APP_VERSION $app_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="craftarr-console-$version/" \
            --output="dist/craftarr-console-$version.tar.gz" \
            HEAD
          cd dist
          sha256sum "craftarr-console-$version.tar.gz" > "craftarr-console-$version.tar.gz.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          archive="dist/craftarr-console-$version.tar.gz"
          checksum="$archive.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" "$checksum" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive" "$checksum" \
              --title "$version" \
              --generate-notes
          fi
