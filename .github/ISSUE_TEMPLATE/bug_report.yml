name: Bug report
description: Something isn't working the way it should.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The fields below are the
        things we end up asking for in almost every bug thread, so filling
        them in saves a round trip.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Craftarr version
      description: Shown in System Settings or returned by `/api/version`.
      placeholder: 0.1.2
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - One-line installer
        - Local install script
        - Manual / from source
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: Include the Linux distribution and version for production installs.
      placeholder: Ubuntu 24.04
    validations:
      required: true

  - type: dropdown
    id: process-backend
    attributes:
      label: Minecraft process backend
      description: If the bug is not tied to a server, choose "Not applicable".
      options:
        - systemd
        - Direct subprocess (development)
        - Not applicable
    validations:
      required: true

  - type: input
    id: mc-version
    attributes:
      label: Minecraft version
      placeholder: "1.21.1"

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant panel output and the Minecraft server log if applicable.
        Panel logs: `sudo craftarr-console logs`. Minecraft service logs:
        `sudo craftarr-console server NAME logs`. Remove secrets and player IPs.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, reverse-proxy details, browser version, or anything unusual about the environment.
