# Shared plugin update sources. Manage this repository from App Settings or edit the YAML.
# Per-server manual or disabled settings override these entries.
# Names and aliases match plugin.yml/paper-plugin.yml metadata, not JAR filenames.
# Paper is monitored separately in the server version UI, not as a plugin.
version: 1
plugins:
  AntiPopup:
    provider: modrinth
    project: https://modrinth.com/plugin/antipopup
  Chunky:
    provider: modrinth
    project: https://modrinth.com/plugin/chunky
  Citizens:
    provider: jenkins
    project: https://ci.citizensnpcs.co/job/Citizens2/
    notes: Compares successful Jenkins builds using JAR metadata, with a filename fallback.
  FastAsyncWorldEdit:
    aliases: [FAWE]
    provider: jenkins
    project: https://ci.athion.net/job/FastAsyncWorldEdit
    notes: Compares successful Jenkins builds using JAR metadata, with a filename fallback. Use the release page to choose the Paper artifact.
  Floodgate:
    aliases: [Floodgate-Spigot]
    provider: custom
    project: https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest
    version_pattern: '"version"\s*:\s*"([^\"]+)"'
    installed_pattern: '^v?([0-9.]+)'
    notes: Monitors base-version changes, not individual CI builds. Minecraft compatibility is unknown.
  Geyser:
    aliases: [Geyser-Spigot, Geyser-Bukkit]
    provider: custom
    project: https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest
    version_pattern: '"build"\s*:\s*(\d+)'
    download_url: 'https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot'
    download_rename: '{filename}-{version}.{extension}'
    installed_pattern: '(?i)^Geyser-(?:Spigot|Bukkit)-([0-9]+)\.jar$'
    installed_detection: filename
    notes: Monitors and installs individual GeyserMC Spigot builds using the JAR filename. Minecraft compatibility is unknown.
  LuckPerms:
    provider: modrinth
    project: https://modrinth.com/plugin/luckperms
    version_pattern: '^v?([0-9]+(?:\.[0-9]+)*)'
  PlaceholderAPI:
    provider: github
    project: https://github.com/PlaceholderAPI/PlaceholderAPI
  Pl3xMap:
    provider: modrinth
    project: https://modrinth.com/plugin/pl3xmap
    notes: Uses beta releases when Pl3xMap has no stable Bukkit/Paper release on Modrinth.
  PlotSquared:
    aliases: [PlotSquared Premium]
    provider: github
    project: https://github.com/IntellectualSites/PlotSquared
    notes: Public release metadata only; premium downloads and credentials are not requested.
  Vault:
    provider: github
    project: https://github.com/MilkBowl/Vault
  ViaVersion:
    provider: github
    project: https://github.com/ViaVersion/ViaVersion
